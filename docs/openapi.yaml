openapi: 3.0.3
info:
  title: API de ventas tcsw-ventas
  version: 1.0.0
  description: |
    API REST básica del prototipo de ventas (P09, módulo M12).
    Expone el catálogo de productos y el registro de ventas sobre los casos de uso existentes.

    Reglas generales:
    - Todas las peticiones y respuestas usan JSON (`application/json`).
    - Todos los errores usan el mismo esquema `Error`; nunca incluyen trazas, SQL ni credenciales.
    - La API no recibe ni registra datos de tarjeta ni datos personales del cliente.
    - El folio de la venta lo genera el servidor.
servers:
  - url: http://localhost:8080
    description: Ejecución local
tags:
  - name: Productos
    description: Consulta del catálogo
  - name: Ventas
    description: Registro de ventas
paths:
  /api/productos:
    get:
      tags: [Productos]
      operationId: listarProductos
      summary: Lista todos los productos del catálogo
      responses:
        '200':
          description: Lista de productos (vacía si no hay ninguno)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
              example:
                - id: 1
                  codigo: P-001
                  nombre: Laptop X
                  precio: 15000.00
                  existencia: 10
                - id: 3
                  codigo: P-003
                  nombre: Mouse Inalámbrico
                  precio: 450.00
                  existencia: 0
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/productos/{id}:
    get:
      tags: [Productos]
      operationId: obtenerProducto
      summary: Obtiene un producto por su identificador
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico del producto
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 1
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
              example:
                id: 1
                codigo: P-001
                nombre: Laptop X
                precio: 15000.00
                existencia: 10
        '400':
          description: El identificador no es un número válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-02T10:15:30Z'
                status: 400
                code: SOLICITUD_INVALIDA
                message: El parámetro 'id' debe ser un número entero.
                path: /api/productos/abc
                details: []
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-02T10:15:30Z'
                status: 404
                code: PRODUCTO_NO_ENCONTRADO
                message: No existe el producto con id 999.
                path: /api/productos/999
                details: []
        '500':
          $ref: '#/components/responses/ErrorInterno'
  /api/ventas:
    post:
      tags: [Ventas]
      operationId: registrarVenta
      summary: Registra una venta
      description: |
        Registra una venta como una sola unidad de trabajo: se confirma completa
        (encabezado, partidas y descuento de existencias) o no se aplica ningún cambio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VentaPeticion'
            example:
              partidas:
                - productoId: 1
                  cantidad: 2
      responses:
        '201':
          description: Venta registrada y existencias descontadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VentaRespuesta'
              example:
                folio: V-20261102101530123
                total: 30000.00
                partidas:
                  - productoId: 1
                    nombre: Laptop X
                    cantidad: 2
                    precioUnitario: 15000.00
                    subtotal: 30000.00
        '400':
          description: Petición inválida (JSON mal formado o datos que no cumplen la validación)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validacion:
                  summary: Datos inválidos
                  value:
                    timestamp: '2026-11-02T10:15:30Z'
                    status: 400
                    code: VALIDACION_FALLIDA
                    message: La petición contiene datos inválidos.
                    path: /api/ventas
                    details:
                      - "partidas[0].cantidad: debe ser mayor o igual a 1"
                jsonInvalido:
                  summary: JSON mal formado
                  value:
                    timestamp: '2026-11-02T10:15:30Z'
                    status: 400
                    code: SOLICITUD_INVALIDA
                    message: El cuerpo de la petición no es un JSON válido.
                    path: /api/ventas
                    details: []
        '404':
          description: Alguno de los productos de la venta no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-02T10:15:30Z'
                status: 404
                code: PRODUCTO_NO_ENCONTRADO
                message: No existe el producto con id 999.
                path: /api/ventas
                details: []
        '409':
          description: Existencia insuficiente; no se registra la venta ni cambia ninguna existencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-11-02T10:15:30Z'
                status: 409
                code: EXISTENCIA_INSUFICIENTE
                message: No hay existencia suficiente para el producto con id 3.
                path: /api/ventas
                details: []
        '500':
          $ref: '#/components/responses/ErrorInterno'
components:
  responses:
    ErrorInterno:
      description: Error interno; el mensaje es genérico y no expone detalles técnicos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            timestamp: '2026-11-02T10:15:30Z'
            status: 500
            code: ERROR_INTERNO
            message: Ocurrió un error interno. Intenta de nuevo más tarde.
            path: /api/ventas
            details: []
  schemas:
    Producto:
      type: object
      required: [id, codigo, nombre, precio, existencia]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        codigo:
          type: string
          example: P-001
        nombre:
          type: string
          example: Laptop X
        precio:
          type: number
          format: double
          minimum: 0
          example: 15000.00
        existencia:
          type: integer
          format: int32
          minimum: 0
          example: 10
    PartidaPeticion:
      type: object
      required: [productoId, cantidad]
      properties:
        productoId:
          type: integer
          format: int32
          minimum: 1
          example: 1
        cantidad:
          type: integer
          format: int32
          minimum: 1
          example: 2
    VentaPeticion:
      type: object
      required: [partidas]
      properties:
        partidas:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PartidaPeticion'
    PartidaRespuesta:
      type: object
      required: [productoId, nombre, cantidad, precioUnitario, subtotal]
      properties:
        productoId:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: Laptop X
        cantidad:
          type: integer
          format: int32
          example: 2
        precioUnitario:
          type: number
          format: double
          example: 15000.00
        subtotal:
          type: number
          format: double
          example: 30000.00
    VentaRespuesta:
      type: object
      required: [folio, total, partidas]
      properties:
        folio:
          type: string
          description: Folio generado por el servidor
          example: V-20261102101530123
        total:
          type: number
          format: double
          example: 30000.00
        partidas:
          type: array
          items:
            $ref: '#/components/schemas/PartidaRespuesta'
    Error:
      type: object
      required: [timestamp, status, code, message, path, details]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          description: Código HTTP
          example: 400
        code:
          type: string
          description: Código estable de error para el cliente
          enum:
            - SOLICITUD_INVALIDA
            - VALIDACION_FALLIDA
            - PRODUCTO_NO_ENCONTRADO
            - EXISTENCIA_INSUFICIENTE
            - ERROR_INTERNO
        message:
          type: string
          description: Mensaje legible, sin trazas, SQL ni credenciales
        path:
          type: string
          example: /api/ventas
        details:
          type: array
          description: Detalle por campo cuando aplica; vacío en el resto de los casos
          items:
            type: string
