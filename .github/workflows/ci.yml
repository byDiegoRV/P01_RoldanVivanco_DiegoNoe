name: CI

# Flujo automatizado del candidato de liberacion (C04):
#   backend  -> mvn verify (pruebas + JaCoCo) contra PostgreSQL 16
#   frontend -> npm ci, ng build, ng test (Chrome sin interfaz)
#   pila     -> construye las imagenes y ejecuta verify-stack + verify-recorrido
# SonarQube NO corre aqui: es local (localhost:9000) y se registra como evidencia manual.

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_USER: postgres
  DB_PASSWORD: ci_password_no_secreto
  DB_NAME: ventas_test

jobs:
  backend:
    name: Backend (Java 11 + PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_no_secreto
          POSTGRES_DB: ventas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ventas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/ventas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Versiones efectivas
        run: |
          java -version
          mvn -version
      - name: Crear esquema de la base de datos
        run: PGPASSWORD="$DB_PASSWORD" psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f src/main/resources/sql/schema.sql
      - name: Instalar Xvfb (pruebas Swing sin pantalla)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Pruebas y cobertura (mvn verify)
        run: |
          mkdir -p target
          # Si las pruebas se quedan colgadas, a los 10 min se guarda un volcado de hilos como evidencia
          ( sleep 600; for p in $(pgrep -f surefire); do jstack "$p" > "target/jstack-$p.txt" 2>&1 || true; done ) &
          VIGILANTE=$!
          set +e
          xvfb-run --auto-servernum mvn -B verify
          RC=$?
          kill "$VIGILANTE" 2>/dev/null
          exit $RC
      - name: Resumen de pruebas
        if: always()
        run: |
          echo "### Pruebas backend" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run:" target/surefire-reports/*.txt 2>/dev/null | awk -F'[:,]' '{t+=$2; f+=$4; e+=$6; s+=$8} END {printf "Total: %d | Fallos: %d | Errores: %d | Omitidas: %d\n", t, f, e, s}' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reportes
          path: |
            target/surefire-reports
            target/site/jacoco
            target/jstack-*.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: tcsw-ventas-jar
          path: target/tcsw-ventas.jar
          if-no-files-found: warn

  frontend:
    name: Frontend (Node 24 + Angular 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Versiones efectivas
        run: |
          node -v
          npm -v
      - name: Instalar dependencias (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Permitir Chrome sin interfaz en el runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Compilar (ng build)
        run: npx ng build
      - name: Pruebas (ng test, ChromeHeadless)
        run: npx ng test --watch=false --browsers=ChromeHeadless --progress=false

  pila:
    name: Pila completa (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de CI (sin secretos reales)
        run: |
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$DB_PASSWORD/" .env
          grep -q '^WEB_PORT=' .env || echo 'WEB_PORT=9095' >> .env
      - name: Construir imagenes (docker compose build)
        run: docker compose build
      - name: Verificar la pila (contenedores, API, BD y cliente)
        run: ./scripts/verify-stack.sh --sin-build
      - name: Verificar el recorrido de la venta y el contrato
        run: ./scripts/verify-recorrido.sh
      - name: Registros de los contenedores (si falla)
        if: failure()
        run: docker compose logs --tail=80
      - name: Apagar
        if: always()
        run: docker compose down -v
