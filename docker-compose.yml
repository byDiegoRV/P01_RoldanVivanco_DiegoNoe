# Pila completa: PostgreSQL + API (Spring Boot) + cliente Angular (nginx)
#   docker compose up -d --build
# Variables (.env, ver .env.example): DB_USER, DB_PASSWORD, DB_NAME, DB_PORT
# Opcionales: API_PORT (9098 por defecto), WEB_PORT (8080 por defecto)
services:
  postgres:
    image: postgres:16
    container_name: postgres_ventas
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Dentro de la red de Compose la BD se llama "postgres" y escucha en 5432
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: "9098"
      PERSISTENCIA: ${PERSISTENCIA:-hibernate}
    ports:
      - "${API_PORT:-9098}:9098"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    ports:
      - "${WEB_PORT:-9095}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
